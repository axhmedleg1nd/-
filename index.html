<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Переводчик на «Цифирный»</title>
<style>
* { box-sizing: border-box; }

/* ===== СТАНДАРТ (тёмная, по умолчанию) ===== */
:root {
  --bg-color: #1e1e1e;
  --bg-gradient: none;
  --text: #eee;
  --accent: #4fc3f7;
  --card-bg: #252525;
  --card-border: #444;
  --input-bg: #2d2d2d;
  --input-border: #444;
  --placeholder: #888;
  --btn-primary-bg: #4fc3f7;
  --btn-primary-text: #000;
  --btn-primary-shadow: #29b6f6;
  --btn-secondary-bg: #3a3a3a;
  --btn-secondary-text: #eee;
  --btn-secondary-shadow: #2a2a2a;
  --btn-danger-bg: #4a2a2a;
  --btn-danger-text: #eee;
  --btn-danger-shadow: #331c1c;
  --toast-bg: #4fc3f7;
  --toast-text: #000;
  --font: Arial, sans-serif;
  --row-radius: 8px;
  --decor-display: none;
  --title-glow: none;
}

/* ===== РОЗОВАЯ ===== */
body.theme-pink {
  --bg-color: #ffc1e3;
  --bg-gradient: linear-gradient(160deg, #ffd6ec 0%, #ffc1e3 40%, #ffb3da 100%);
  --text: #7a2e55;
  --accent: #e6399b;
  --card-bg: rgba(255,255,255,0.55);
  --card-border: #ff9fd1;
  --input-bg: #fff0f8;
  --input-border: #ffb3da;
  --placeholder: #d98fbd;
  --btn-primary-bg: linear-gradient(135deg, #ff9fd1, #ff6fb5);
  --btn-primary-text: #fff;
  --btn-primary-shadow: #e6399b;
  --btn-secondary-bg: linear-gradient(135deg, #fff0f8, #ffd6ec);
  --btn-secondary-text: #e6399b;
  --btn-secondary-shadow: #ff9fd1;
  --btn-danger-bg: linear-gradient(135deg, #ffb3da, #ff85c1);
  --btn-danger-text: #fff;
  --btn-danger-shadow: #d1428e;
  --toast-bg: linear-gradient(135deg, #ff9fd1, #e6399b);
  --toast-text: #fff;
  --font: 'Comic Sans MS', 'Segoe UI', sans-serif;
  --row-radius: 18px;
  --decor-display: block;
  --title-glow: 0 0 6px #fff, 0 0 12px #ffb3da;
}

/* ===== МЕЛСТРОЙНОСТЬ (грязный грайм-стиль) ===== */
body.theme-melstroy {
  --bg-color: #100d08;
  --bg-gradient: radial-gradient(circle at 30% 10%, #3a2f0a 0%, #100d08 55%),
                 radial-gradient(circle at 80% 90%, #2a1005 0%, transparent 50%);
  --text: #d8cba0;
  --accent: #ffcc00;
  --card-bg: rgba(22, 18, 10, 0.82);
  --card-border: #6b5a1a;
  --input-bg: #0c0a06;
  --input-border: #5c4d16;
  --placeholder: #6b5f3a;
  --btn-primary-bg: linear-gradient(135deg, #d4af00, #6b5410);
  --btn-primary-text: #0f0b00;
  --btn-primary-shadow: #453600;
  --btn-secondary-bg: #201a0c;
  --btn-secondary-text: #d4af00;
  --btn-secondary-shadow: #0c0900;
  --btn-danger-bg: #2e1010;
  --btn-danger-text: #e0b0b0;
  --btn-danger-shadow: #150707;
  --toast-bg: linear-gradient(135deg, #d4af00, #6b5410);
  --toast-text: #0f0b00;
  --font: 'Impact', Arial, sans-serif;
  --row-radius: 4px;
  --decor-display: block;
  --title-glow: 1px 1px 0 #000, 0 0 10px #d4af0055;
}

/* грязная текстура поверх фона: царапины/пятна через шумовой SVG-фильтр */
body.theme-melstroy::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* потёки грязи/краски по краям экрана */
body.theme-melstroy::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 8% 100%, rgba(0,0,0,0.6) 0%, transparent 30%),
    radial-gradient(circle at 92% 0%, rgba(0,0,0,0.55) 0%, transparent 28%),
    linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 12%, transparent 88%, rgba(0,0,0,0.45) 100%);
}

body.theme-melstroy h1,
body.theme-melstroy .row,
body.theme-melstroy .hint {
  position: relative;
  z-index: 1;
}

body.theme-melstroy .row {
  border-style: solid;
  border-width: 2px;
  box-shadow: 0 0 0 1px #000 inset, 0 6px 14px rgba(0,0,0,0.6);
  filter: contrast(1.05) saturate(0.9);
}

body.theme-melstroy textarea {
  filter: contrast(1.05);
}

body.theme-melstroy button.action-btn {
  text-transform: uppercase;
  letter-spacing: 0.5px;
  filter: contrast(1.1) saturate(0.85);
}

/* фото-коллаж мемов, вмонтированный грязно и криво */
.melstroy-collage {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
body.theme-melstroy .melstroy-collage { display: block; }
.melstroy-collage img {
  position: absolute;
  filter: grayscale(0.55) sepia(0.35) contrast(1.15) brightness(0.75);
  opacity: 0.4;
  border: 3px solid rgba(0,0,0,0.5);
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}

/* ===== ЗАХИР (дискотечно-угарная) ===== */
body.theme-zahir {
  --bg-color: #1a0033;
  --bg-gradient: linear-gradient(120deg, #ff00c8, #7b2ff7, #00e5ff, #ffee00);
  --text: #fff;
  --accent: #00ffe1;
  --card-bg: rgba(20, 0, 40, 0.55);
  --card-border: #ff00c8;
  --input-bg: rgba(0,0,0,0.4);
  --input-border: #00ffe1;
  --placeholder: #d9b3ff;
  --btn-primary-bg: linear-gradient(135deg, #ff00c8, #7b2ff7, #00e5ff);
  --btn-primary-text: #fff;
  --btn-primary-shadow: #4b0082;
  --btn-secondary-bg: rgba(255,255,255,0.15);
  --btn-secondary-text: #fff;
  --btn-secondary-shadow: rgba(0,0,0,0.4);
  --btn-danger-bg: linear-gradient(135deg, #ff4d4d, #ff00c8);
  --btn-danger-text: #fff;
  --btn-danger-shadow: #4b0082;
  --toast-bg: linear-gradient(135deg, #ffee00, #ff00c8);
  --toast-text: #1a0033;
  --font: 'Comic Sans MS', 'Segoe UI', sans-serif;
  --row-radius: 20px;
  --decor-display: block;
  --title-glow: 0 0 10px #ff00c8, 0 0 20px #00ffe1;
}
body.theme-zahir {
  background-size: 300% 300%;
  animation: zahirShift 8s ease infinite;
}
@keyframes zahirShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body {
  font-family: var(--font);
  margin: 0;
  padding: 15px;
  background: var(--bg-gradient), var(--bg-color);
  background-color: var(--bg-color);
  color: var(--text);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  transition: background 0.4s, color 0.4s;
}

.bg-decor {
  position: fixed;
  font-size: 22px;
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
  filter: drop-shadow(0 0 2px #fff);
  display: none;
}
body.theme-pink .bg-decor.deco-pink,
body.theme-melstroy .bg-decor.deco-melstroy,
body.theme-zahir .bg-decor.deco-zahir {
  display: var(--decor-display);
}

/* ===== шапка: заголовок + меню тем ===== */
.header-bar {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 5;
}

/* ===== меню тем (3 точки) ===== */
.theme-menu-wrap {
  position: relative;
  flex-shrink: 0;
  margin-top: 4px;
}
.theme-dots {
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 20px;
  cursor: pointer;
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}
.theme-dropdown {
  position: absolute;
  top: 50px;
  right: 0;
  z-index: 9999;
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-radius: 12px;
  min-width: 220px;
  max-width: 260px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  display: none;
  backdrop-filter: blur(4px);
}
.theme-dropdown.open { display: block; }
.theme-option {
  padding: 12px 16px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid rgba(128,128,128,0.2);
}
.theme-option:last-child { border-bottom: none; }
.theme-option:active { opacity: 0.7; }
.theme-option .check { opacity: 0; flex-shrink: 0; }
.theme-option.active .check { opacity: 1; color: var(--accent); }
.theme-option .arrow {
  opacity: 0.5;
  font-size: 16px;
}
.back-option {
  color: var(--accent);
  font-weight: bold;
  opacity: 0.85;
}
.wip-tag {
  font-size: 11px;
  opacity: 0.6;
  font-weight: normal;
}
.support-option {
  color: var(--accent);
  font-weight: bold;
  border-top: 2px solid var(--card-border);
}

.wip-badge {
  display: none;
  text-align: center;
  font-size: 12px;
  color: var(--text);
  opacity: 0.8;
  background: var(--card-bg);
  border: 1px dashed var(--card-border);
  border-radius: 10px;
  padding: 6px 10px;
  margin: -6px 0 14px;
}
body.theme-zahir .wip-badge { display: block; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 10000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 22px;
  max-width: 340px;
  width: 100%;
  color: var(--text);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.modal-card h2 {
  color: var(--accent);
  font-size: 18px;
  margin: 0 0 12px;
}
.modal-card p {
  font-size: 14px;
  line-height: 1.6;
  margin: 0 0 18px;
}
.modal-card .action-btn {
  width: 100%;
}

h1 {
  color: var(--accent);
  font-size: 22px;
  text-align: center;
  margin: 10px 0 20px;
  flex: 1;
  min-width: 0;
  text-shadow: var(--title-glow);
}

.row {
  margin-bottom: 20px;
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-radius: var(--row-radius);
  padding: 14px;
  position: relative;
  z-index: 1;
  transition: background 0.4s, border-color 0.4s;
}
body.theme-pink .row::before { content: "✨"; position: absolute; top: -10px; right: 10px; font-size: 18px; }
body.theme-pink .row::after { content: "✨"; position: absolute; bottom: -10px; left: 10px; font-size: 18px; }
body.theme-melstroy .row::before { content: "💰"; position: absolute; top: -10px; right: 10px; font-size: 18px; }
body.theme-zahir .row::before { content: "🎉"; position: absolute; top: -10px; right: 10px; font-size: 18px; }

label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  color: var(--accent);
  font-weight: bold;
  font-size: 15px;
}

textarea {
  width: 100%;
  height: 130px;
  font-size: 16px;
  padding: 12px;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  resize: vertical;
  font-family: inherit;
  transition: background 0.4s, border-color 0.4s, color 0.4s;
}
textarea::placeholder { color: var(--placeholder); }
textarea:focus { outline: none; border-color: var(--accent); }

.btn-group { display: flex; gap: 8px; margin-top: 10px; }

button.action-btn {
  background: var(--btn-primary-bg);
  color: var(--btn-primary-text);
  border: none;
  padding: 10px 6px;
  font-size: 14px;
  border-radius: 10px;
  cursor: pointer;
  flex: 1 1 0;
  min-width: 0;
  width: auto;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: break-word;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 0 var(--btn-primary-shadow), 0 4px 8px rgba(0,0,0,0.15);
  transition: transform 0.1s, background 0.4s;
}
button.action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-primary-shadow); }

.btn-secondary {
  background: var(--btn-secondary-bg) !important;
  color: var(--btn-secondary-text) !important;
  box-shadow: 0 3px 0 var(--btn-secondary-shadow), 0 4px 8px rgba(0,0,0,0.1) !important;
}
.btn-danger {
  background: var(--btn-danger-bg) !important;
  color: var(--btn-danger-text) !important;
  box-shadow: 0 3px 0 var(--btn-danger-shadow), 0 4px 8px rgba(0,0,0,0.15) !important;
}

.hint {
  font-size: 13px;
  color: var(--text);
  opacity: 0.85;
  margin-top: 22px;
  line-height: 1.8;
  background: var(--card-bg);
  padding: 16px;
  border-radius: 16px;
  border: 2px dashed var(--card-border);
  position: relative;
  z-index: 1;
}
.hint b { color: var(--accent); }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--toast-bg);
  color: var(--toast-text);
  padding: 10px 22px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 100;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  max-width: 88vw;
  text-align: center;
  white-space: normal;
}
.toast.show { opacity: 1; }
</style>
</head>
